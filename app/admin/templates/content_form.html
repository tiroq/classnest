{% extends "base.html" %}
{% block title_suffix %} — {{ "Edit" if item else "New" }} Item{% endblock %}
{% block content %}
<h1>{{ "Edit Item #" + item.id|string if item else "New Content Item" }}</h1>
{% if error %}<div class="alert alert-error">{{ error }}</div>{% endif %}
{% if success %}<div class="alert alert-success">{{ success }}</div>{% endif %}

<form method="post" enctype="multipart/form-data">
    <div class="field">
        <label>Title *</label>
        <input name="title" value="{{ item.title if item else '' }}" required maxlength="200">
    </div>
    <div class="field">
        <label>Category *</label>
        <select name="category" required>
            <option value="activity" {% if item and item.category.value == "activity" %}selected{% endif %}>Activity</option>
            <option value="craft" {% if item and item.category.value == "craft" %}selected{% endif %}>Craft</option>
            <option value="logic" {% if item and item.category.value == "logic" %}selected{% endif %}>Logic</option>
        </select>
    </div>
    <div class="field">
        <label>Image URL</label>
        <input name="image_url" value="{{ item.image_url or '' if item else '' }}">
    </div>
    <div class="field">
        <label>Upload Image (overrides URL)</label>
        <input type="file" name="image_file" accept="image/*">
    </div>
    <div class="field">
        <label>Source URL</label>
        <input name="source_url" value="{{ item.source_url or '' if item else '' }}">
    </div>
    <div class="field">
        <label>Description</label>
        <textarea name="description" rows="3">{{ item.description or '' if item else '' }}</textarea>
    </div>
    <div class="field">
        <label>Source</label>
        <select name="source">
            <option value="local" {% if item and item.source == "local" %}selected{% endif %}>Local</option>
            <option value="pinterest" {% if item and item.source == "pinterest" %}selected{% endif %}>Pinterest</option>
        </select>
    </div>
    <div class="field">
        <label>Tags (JSON)</label>
        <input name="tags_json" value="{{ item.tags_json or '' if item else '' }}">
    </div>
    <div class="field" style="display:flex;gap:1rem">
        <div style="flex:1">
            <label>Age Min</label>
            <input type="number" name="age_min" value="{{ item.age_min if item and item.age_min is not none else '' }}">
        </div>
        <div style="flex:1">
            <label>Age Max</label>
            <input type="number" name="age_max" value="{{ item.age_max if item and item.age_max is not none else '' }}">
        </div>
    </div>
    <div class="field">
        <label>Difficulty</label>
        <select name="difficulty">
            <option value="" {% if not item or not item.difficulty %}selected{% endif %}></option>
            <option value="easy" {% if item and item.difficulty == "easy" %}selected{% endif %}>Easy</option>
            <option value="medium" {% if item and item.difficulty == "medium" %}selected{% endif %}>Medium</option>
            <option value="hard" {% if item and item.difficulty == "hard" %}selected{% endif %}>Hard</option>
        </select>
    </div>
    <button type="submit" class="btn btn-primary">Save</button>
    <a href="/admin/content" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
